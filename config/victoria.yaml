memory:
  enabled: true
  db_path: data/memory/victoria.db
  max_context_messages: 20
  save_all_conversations: true
tools:
  enabled: true
  confirm_dangerous: true
  lock_reboot: true
  lock_data_removal: true
  # Dangerous tools triggered from the HUD (no interactive prompt there) stay
  # blocked (fail-closed) unless this is explicitly set to true.
  allow_dangerous_in_hud: false
  dangerous_commands:
  - rm
  - rm -rf
  - rmdir
  - unlink
  - shred
  - mkfs
  - dd if=
  - shutdown
  - reboot
  - poweroff
  - halt
  - systemctl stop
  - systemctl reboot
  - systemctl poweroff
  - '> /dev/'
rea:
  verify_ssl: false
ide:
  workspace: .
  allow_run: true
  run_timeout: 20
mcp:
  enabled: true
  # Victoria's own MCP server: exposes her brain to external AI clients (victoria-mcp).
  victoria_server:
    enabled: true
    # Dangerous tools (delete/terminal/self-modify...) stay blocked for MCP
    # clients unless explicitly enabled here.
    allow_dangerous_tools: false
  servers:
    rea:
      enabled: true
      command: npx
      args:
      - -y
      - rea-agents@latest
      - mcp
      tool_prefix: rea
      timeout: 600
logging:
  level: INFO
  file: data/logs/victoria.log
  console: true
  rich_format: true

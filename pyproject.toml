[project]
name = "victoria"
version = "0.1.0"
description = "Victoria - Smart Personal AI Assistant for Linux with Voice Authentication & Pluggable AI Brain"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Hariom"},
]

[project.scripts]
victoria = "victoria.main:main"

[tool.setuptools.packages.find]
include = ["victoria*"]

[tool.setuptools.package-data]
victoria = ["hud/static/**/*"]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"
